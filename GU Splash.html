<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A1B2E}
@keyframes dot{0%{transform:translate(-50%,-50%) scale(0);opacity:1}14%{transform:translate(-50%,-50%) scale(1);opacity:1}26%,100%{transform:translate(-50%,-50%) scale(1.6);opacity:0}}
@keyframes reveal{0%,14%{clip-path:circle(calc(var(--w)*.08) at var(--sx) var(--sy));opacity:1}34%{clip-path:circle(160vmax at var(--sx) var(--sy));opacity:1}92%{opacity:1}100%{clip-path:circle(160vmax at var(--sx) var(--sy));opacity:0}}
@keyframes logo{0%,26%{opacity:0;transform:translateY(14px) scale(.96)}44%,100%{opacity:1;transform:none}}
@keyframes bar{0%,34%{transform:scaleX(0)}86%,100%{transform:scaleX(1)}}
@keyframes txt{0%,40%{opacity:0}50%,92%{opacity:1}100%{opacity:0}}
@keyframes ring{0%,10%{transform:translate(-50%,-50%) scale(1);opacity:0}14%{opacity:.5}30%{transform:translate(-50%,-50%) scale(9);opacity:0}100%{opacity:0}}
</style>
</helmet>
<div data-screen-label="Splash" style="--w:min(300px,70vw);--h:calc(var(--w)*1.0556);--sx:calc(50% - var(--w)*.09);--sy:calc(50% - var(--h)*.374);position:fixed;inset:0;background:#0A1B2E;overflow:hidden;font-family:'IBM Plex Sans',system-ui,sans-serif">
  <div style="position:absolute;left:var(--sx);top:var(--sy);width:calc(var(--w)*.16);height:calc(var(--w)*.16);border-radius:50%;border:2px solid #F58A1F;animation:ring 7s ease-out infinite"></div>
  <div style="position:absolute;inset:0;background:#fff;animation:reveal 7s cubic-bezier(.6,0,.2,1) infinite">
    <img src="assets/gu-logo.png" alt="GU Financial Services" style="position:absolute;left:50%;top:50%;width:var(--w);height:var(--h);margin:calc(var(--h)/-2) 0 0 calc(var(--w)/-2);object-fit:contain;animation:logo 7s cubic-bezier(.2,.8,.2,1) infinite">
    <div style="position:absolute;left:0;right:0;bottom:48px;display:flex;flex-direction:column;align-items:center;gap:16px;animation:txt 7s infinite">
      <div style="width:min(220px,50vw);height:3px;background:#DCE8F5;border-radius:2px;overflow:hidden"><div style="height:100%;background:#1667B8;transform-origin:left;animation:bar 7s linear infinite"></div></div>
      <div style="font-weight:500;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#1667B8">GU Financial Services Pvt. Ltd.</div>
    </div>
  </div>
  <div style="position:absolute;left:var(--sx);top:var(--sy);width:calc(var(--w)*.16);height:calc(var(--w)*.16);border-radius:50%;background:#F58A1F;transform:translate(-50%,-50%) scale(0);animation:dot 7s cubic-bezier(.3,1.4,.5,1) infinite"></div>
</div>

</x-dc>
</body>
</html>
